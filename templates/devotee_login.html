{% extends "base.html" %}

{% block title %}Pilgrim Login{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block nav %}
<a href="{{ url_for('role') }}">Back</a>
{% endblock %}

{% block content %}

<div class="bg">
  <div class="card">
    <h2>Pilgrim Login</h2>
    <p>Enter your spiritual journey</p>

    <!-- LOGIN FORM -->
    <form method="post">
      <input
        type="text"
        name="username"
        placeholder="Enter your username"
        required
      >

      <input
        type="password"
        name="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Begin Spiritual Journey
      </button>
    </form>

    <!-- GOOGLE LOGIN BUTTON (OUTSIDE FORM) -->
    <div style="margin-top:20px; text-align:center;">
        <a href="/google-login">
            <img 
                src="https://developers.google.com/identity/images/btn_google_signin_dark_normal_web.png"
                alt="Sign in with Google"
                style="width:100%; max-width:260px; display:block; margin:auto;">
        </a>
    </div>

    <!-- LINKS -->
    <div style="margin-top:15px; text-align:center;">
        <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
    </div>

    <p class="small" style="margin-top:10px;">Don't have an account?</p>
    <a href="{{ url_for('devotee_register') }}">Create New Account</a>

  </div>
</div>

{% endblock %}
